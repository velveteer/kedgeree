name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6', '9.10', '9.12', '9.14']

    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.14'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ci-${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ci-${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build
        run: |
          cabal update
          cabal build all --enable-tests

      - name: Test
        run: cabal test --test-show-details=direct

      - name: Package
        run: |
          cabal check
          cabal sdist

  lint:
    runs-on: ubuntu-latest
    env:
      FOURMOLU_VERSION: 0.20.1.0
      HLINT_VERSION: '3.10'
    steps:
      - uses: actions/checkout@v7

      - name: Install fourmolu and hlint
        # Pinned direct downloads. haskell-actions/run-fourmolu@v11 cannot fetch
        # fourmolu >= 0.20 (zip assets) and haskell-actions/hlint-* still run on Node 20.
        run: |
          curl -sSL -o fourmolu.zip \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          unzip -q fourmolu.zip
          install -m 755 "fourmolu-${FOURMOLU_VERSION}-linux-x86_64/fourmolu" /usr/local/bin/fourmolu
          rm -rf fourmolu.zip "fourmolu-${FOURMOLU_VERSION}-linux-x86_64"

          curl -sSL "https://github.com/ndmitchell/hlint/releases/download/v${HLINT_VERSION}/hlint-${HLINT_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/hlint-${HLINT_VERSION}" >> "$GITHUB_PATH"

      - name: fourmolu
        run: |
          fourmolu --version
          fourmolu --mode check --check-idempotence src app test

      - name: hlint
        run: |
          hlint --version
          hlint src app test
